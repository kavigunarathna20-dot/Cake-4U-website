        <script>
            // Checks every "revealable" element (goal cards, content boxes,
            // and the #exp heading) and adds the "active" class once the
            // element has scrolled far enough into the viewport, which
            // triggers the fade/slide-in CSS transition defined above.
            function reveal() {
                // Select all elements that should animate in on scroll
                const reveals = document.querySelectorAll(".card, .content-box, #exp");

                reveals.forEach((item) => {
                // Height of the visible browser window
                const windowHeight = window.innerHeight;
                // Distance from the top of the viewport to the top of the element
                const elementTop = item.getBoundingClientRect().top;
                // How many pixels of the element must be visible before it reveals
                const visiblePoint = 100;

                // If the element has scrolled far enough up into view, reveal it
                if (elementTop < windowHeight - visiblePoint) {
                    item.classList.add("active");
                }
                });
            }

            // Re-check on every scroll event
            window.addEventListener("scroll", reveal);
            // Run once immediately on page load (in case content is already in view)
            reveal();
        </script>
